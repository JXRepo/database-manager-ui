<svg class="charts-histogram-svg" data-measure="{{ item.key }}" viewBox="0 0 660 270" role="group" aria-label="{{ item.title }} distribution{% if item.unit %} in {{ item.unit }}{% endif %}; counts are {{ item.observation_unit }}" xmlns="http://www.w3.org/2000/svg">
  <text x="62" y="18" class="charts-axis-text">{{ item.observation_unit|capfirst }}</text>
  {% if item.offset %}<text x="636" y="18" text-anchor="end" class="charts-axis-text">Interval offset: {{ item.offset }}</text>{% endif %}
  <g transform="translate(0,24)">
  {% for tick in histogram.ticks %}<line x1="62" x2="636" y1="{{ tick.y }}" y2="{{ tick.y }}" class="charts-grid-line"/><text x="49" y="{{ tick.y }}" text-anchor="end" dominant-baseline="middle" class="charts-axis-text">{{ tick.label }}</text>{% endfor %}
  {% for bin in histogram.columns %}
    {% if bin.count %}<a class="charts-bin" href="{{ bin.url }}" data-object-count="{{ bin.object_count }}" data-observation-count="{{ bin.count }}" aria-label="{{ bin.label }}{% if item.unit %} {{ item.unit }}{% endif %}: {{ bin.count }} {{ item.observation_unit }}. View {{ bin.object_count }} objects."><title>{{ bin.label }}{% if item.unit %} {{ item.unit }}{% endif %}: {{ bin.count }} {{ item.observation_unit }} from {{ bin.object_count }} objects</title>{% else %}<g>{% endif %}
      <rect x="{{ bin.x }}" y="{{ bin.y }}" width="{{ bin.width }}" height="{{ bin.plot_height }}" rx="3" class="charts-bin-mark"/>
      <text x="{{ bin.center }}" y="{{ bin.count_y }}" text-anchor="middle" class="charts-bin-count">{{ bin.count }}</text>
    {% if bin.count %}</a>{% else %}</g>{% endif %}
  {% endfor %}
  {% for tick in histogram.x_ticks %}<text x="{{ tick.x }}" y="207" text-anchor="{{ tick.anchor }}" class="charts-bin-label">{{ tick.label }}</text>{% endfor %}
  <text x="349" y="235" text-anchor="middle" class="charts-axis-text">{{ item.title }}{% if item.unit %} ({{ item.unit }}){% endif %}</text>
  </g>
</svg>
