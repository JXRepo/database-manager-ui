<svg class="charts-histogram-svg" viewBox="0 0 660 240" role="group" aria-label="{{ item.title }} distribution{% if item.unit %} in {{ item.unit }}{% endif %}; counts are {{ item.observation_unit }}" xmlns="http://www.w3.org/2000/svg">
  <text x="62" y="12" class="charts-axis-text">{{ item.observation_unit|capfirst }}</text>
  {% for tick in histogram.ticks %}<line x1="62" x2="636" y1="{{ tick.y }}" y2="{{ tick.y }}" class="charts-grid-line"/><text x="49" y="{{ tick.y }}" text-anchor="end" dominant-baseline="middle" class="charts-axis-text">{{ tick.label }}</text>{% endfor %}
  {% for bin in histogram.columns %}
    {% if bin.count %}<a class="charts-bin" href="{{ bin.url }}" aria-label="{{ bin.label }}{% if item.unit %} {{ item.unit }}{% endif %}: {{ bin.count }} {{ item.observation_unit }}. View {{ bin.object_count }} objects."><title>{{ bin.label }}{% if item.unit %} {{ item.unit }}{% endif %}: {{ bin.count }} {{ item.observation_unit }} from {{ bin.object_count }} objects</title>{% else %}<g>{% endif %}
      <rect x="{{ bin.x }}" y="{{ bin.y }}" width="{{ bin.width }}" height="{{ bin.plot_height }}" rx="3" class="charts-bin-mark"/>
      <text x="{{ bin.center }}" y="{{ bin.count_y }}" text-anchor="middle" class="charts-bin-count">{{ bin.count }}</text>
      <text x="{{ bin.center }}" y="194" text-anchor="middle" class="charts-bin-label"><tspan x="{{ bin.center }}">{{ bin.low_label }}{% if bin.low != bin.high %} –{% endif %}</tspan>{% if bin.low != bin.high %}<tspan x="{{ bin.center }}" dy="14">{% if not bin.inclusive %}&lt; {% endif %}{{ bin.high_label }}</tspan>{% endif %}</text>
    {% if bin.count %}</a>{% else %}</g>{% endif %}
  {% endfor %}
  <text x="349" y="235" text-anchor="middle" class="charts-axis-text">{{ item.title }}{% if item.unit %} ({{ item.unit }}){% endif %}</text>
</svg>
