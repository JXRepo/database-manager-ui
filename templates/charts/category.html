<svg class="charts-bar-svg" viewBox="0 0 340 {{ plot.height }}" role="group" aria-label="{% if category %}{{ category.title }} counts{% else %}Available mechanical results{% endif %}"{% if category %} data-category="{{ category.key }}"{% endif %} xmlns="http://www.w3.org/2000/svg">
  {% for tick in plot.ticks %}<line x1="{{ tick.x }}" x2="{{ tick.x }}" y1="12" y2="{{ plot.baseline }}" class="charts-grid-line"/><text x="{{ tick.x }}" y="{{ plot.baseline|add:'20' }}" text-anchor="middle" class="charts-axis-text">{{ tick.label }}</text>{% endfor %}
  {% for row in plot.rows %}<a class="charts-bar" href="{{ row.url }}" aria-label="{{ row.label }}: {{ row.count }} object{{ row.count|pluralize }}. Filter statistics to these objects." data-label="{{ row.label }}"><title>{{ row.label }}: {{ row.count }}</title><rect x="0" y="{{ row.y|add:'-5' }}" width="338" height="34" fill="transparent"/><text x="0" y="{{ row.label_y }}" class="charts-bar-label">{{ row.short_label }}</text><rect x="134" y="{{ row.y }}" width="{{ row.width }}" height="22" rx="3" class="charts-bar-mark"/><text x="{{ row.value_x }}" y="{{ row.label_y }}" class="charts-bar-count">{{ row.count }}</text></a>{% endfor %}
  <text x="220" y="{{ plot.height|add:'-2' }}" text-anchor="middle" class="charts-axis-text">Data objects</text>
</svg>
