<div class="charts-pie-layout">
  <svg class="charts-pie-svg" viewBox="0 0 280 260" role="group" aria-label="Stress–strain coverage pie chart for {{ total_objects }} objects" xmlns="http://www.w3.org/2000/svg">
    {% for slice in coverage_plot.slices %}<a class="charts-pie-slice" href="{{ slice.url }}" aria-label="{{ slice.label }}: {{ slice.count }} objects, {{ slice.percent|floatformat:'1u' }}%. View objects."><title>{{ slice.label }}: {{ slice.count }} objects ({{ slice.percent|floatformat:'1u' }}%)</title><path d="{{ slice.path }}" fill="{{ slice.color }}"/></a>{% endfor %}
  </svg>
  <table class="charts-statistics-table charts-coverage-table">
    <caption>Stress–strain coverage<span>{{ total_objects }} selected object{{ total_objects|pluralize }} = 100%.</span></caption>
    <thead><tr><th scope="col">Matching components</th><th scope="col">Objects</th><th scope="col">%</th></tr></thead>
    <tbody>{% for row in coverage_rows %}<tr><th scope="row"><a class="charts-coverage-link" href="{{ row.url }}" data-count="{{ row.count }}" data-coverage="{{ row.key }}"><span class="charts-pie-key" style="background: {{ row.color }}" aria-hidden="true"></span>{% if row.key == 'matching' %}Available{% else %}Not available{% endif %}</a></th><td>{{ row.count }}</td><td>{{ row.percent|floatformat:'1u' }}%</td></tr>{% endfor %}</tbody>
  </table>
</div>
