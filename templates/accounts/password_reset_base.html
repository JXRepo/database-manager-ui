{% extends "layouts/base-auth.html" %}
{% load static %}

{% block title %}Password recovery{% endblock title %}
{% block loader %}{% endblock loader %}

{% block content %}
<main class="auth-main">
  <div class="auth-wrapper v1">
    <div class="auth-form">
      <div class="card mb-0">
        <div class="card-body">
          <div class="text-center mb-4">
            <a href="{% url 'index' %}" class="d-inline-flex align-items-center justify-content-center gap-2 text-dark">
              <span class="flex-shrink-0"><img src="{% static 'assets/images/logo-icon.svg' %}" alt="" width="35" height="35"></span>
              <span class="f-w-600">Materials Simulation Data Platform</span>
            </a>
          </div>
          {% block recovery_content %}{% endblock recovery_content %}
        </div>
      </div>
    </div>
  </div>
</main>
{% endblock content %}
