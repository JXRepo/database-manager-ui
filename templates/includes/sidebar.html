{% load i18n static admin_datta %}

<nav class="pc-sidebar">
  <div class="navbar-wrapper">
    <div class="m-header">
      <a href="{% url 'search' %}" class="b-brand text-primary">
        <img src="{% static 'assets/images/logo-white.svg' %}" class="img-fluid" alt="logo">
      </a>
    </div>

    <div class="navbar-content">
      <ul class="pc-navbar">
        {% if request.user.is_superuser %}
        <li class="pc-item pc-caption">
          <label>ADMIN</label>
        </li>
        <li class="pc-item">
          <a href="{% url 'admin:index' %}" class="pc-link">
            <span class="pc-micon">
              <i data-feather="settings"></i>
            </span>
            <span class="pc-mtext">Superuser UI</span>
          </a>
        </li>
        {% endif %}

        <li class="pc-item pc-caption">
          <label>Apps</label>
        </li>

        <li class="pc-item">
          <a href="{% url 'search' %}" class="pc-link">
            <span class="pc-micon">
              <i data-feather="search"></i>
            </span>
            <span class="pc-mtext">Search</span>
          </a>
        </li>

        <li class="pc-item">
          <a href="{% url 'upload_json' %}" class="pc-link">
            <span class="pc-micon">
              <i data-feather="upload"></i>
            </span>
            <span class="pc-mtext">Upload Data</span>
          </a>
        </li>

        <li class="pc-item">
          <a href="{% url 'json_data_list' %}" class="pc-link">
            <span class="pc-micon">
              <i data-feather="list"></i>
            </span>
            <span class="pc-mtext">Data List</span>
          </a>
        </li>

        <li class="pc-item">
          <a href="{% url 'charts' %}" class="pc-link">
            <span class="pc-micon">
              <i data-feather="bar-chart"></i>
            </span>
            <span class="pc-mtext">Charts</span>
          </a>
        </li>

        <li class="pc-item pc-caption">
          <label>Account</label>
        </li>

        {% if not request.user.is_authenticated %}
        <li class="pc-item">
          <a href="{% url 'login' %}" class="pc-link">
            <span class="pc-micon">
              <i data-feather="lock"></i>
            </span>
            <span class="pc-mtext">Login</span>
          </a>
        </li>
        <li class="pc-item">
          <a href="{% url 'register' %}" class="pc-link">
            <span class="pc-micon">
              <i data-feather="user-plus"></i>
            </span>
            <span class="pc-mtext">Register</span>
          </a>
        </li>
        {% else %}
        <li class="pc-item">
          <a href="{% url 'logout' %}" class="pc-link">
            <span class="pc-micon">
              <svg class="pc-icon me-2">
                <use xlink:href="#custom-logout-1-outline"></use>
              </svg>
            </span>
            <span class="pc-mtext">Logout</span>
          </a>
        </li>
        {% endif %}
      </ul>
    </div>
  </div>
</nav>
