<style>
  .fair-assistant-widget {
    position: fixed;
    right: 22px;
    bottom: 22px;
    z-index: 1080;
    font-family: inherit;
  }

  .fair-assistant-toggle {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 48px;
    height: 48px;
    border: none;
    border-radius: 50%;
    background: #2563eb;
    color: #ffffff;
    box-shadow: 0 12px 28px rgba(37, 99, 235, 0.28);
  }

  .fair-assistant-toggle i {
    width: 22px;
    height: 22px;
  }

  .fair-assistant-panel {
    position: absolute;
    right: 0;
    bottom: 60px;
    display: none;
    width: min(360px, calc(100vw - 32px));
    overflow: hidden;
    border: 1px solid #dbe2ea;
    border-radius: 14px;
    background: #ffffff;
    box-shadow: 0 18px 45px rgba(15, 23, 42, 0.16);
  }

  .fair-assistant-widget.is-open .fair-assistant-panel {
    display: block;
  }

  .fair-assistant-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 12px 14px;
    border-bottom: 1px solid #eef2f7;
    background: #f8fafc;
  }

  .fair-assistant-title {
    color: #111827;
    font-size: 0.95rem;
    font-weight: 700;
  }

  .fair-assistant-close {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 28px;
    height: 28px;
    border: none;
    border-radius: 50%;
    background: transparent;
    color: #64748b;
  }

  .fair-assistant-close:hover {
    background: #e2e8f0;
    color: #0f172a;
  }

  .fair-assistant-messages {
    display: grid;
    gap: 8px;
    max-height: 310px;
    overflow-y: auto;
    padding: 12px;
    background: #ffffff;
  }

  .fair-assistant-message {
    max-width: 92%;
    border-radius: 12px;
    padding: 9px 11px;
    font-size: 0.88rem;
    line-height: 1.45;
    white-space: pre-line;
  }

  .fair-assistant-message.assistant {
    justify-self: start;
    background: #f1f5f9;
    color: #1f2937;
  }

  .fair-assistant-message.user {
    justify-self: end;
    background: #dbeafe;
    color: #1e3a8a;
  }

  .fair-assistant-suggestions {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    padding: 0 12px 10px;
  }

  .fair-assistant-suggestion {
    border: 1px solid #dbe2ea;
    border-radius: 999px;
    background: #ffffff;
    color: #334155;
    font-size: 0.78rem;
    font-weight: 600;
    padding: 5px 9px;
  }

  .fair-assistant-form {
    display: grid;
    gap: 8px;
    padding: 12px;
    border-top: 1px solid #eef2f7;
  }

  .fair-assistant-input {
    min-height: 72px;
    resize: vertical;
    border: 1px solid #dbe2ea;
    border-radius: 10px;
    padding: 9px 10px;
    font: inherit;
    font-size: 0.88rem;
  }

  .fair-assistant-actions {
    display: flex;
    justify-content: flex-end;
  }

  .fair-assistant-send {
    border: none;
    border-radius: 999px;
    background: #2563eb;
    color: #ffffff;
    font-size: 0.85rem;
    font-weight: 700;
    padding: 7px 14px;
  }

  .fair-assistant-send:disabled {
    cursor: not-allowed;
    opacity: 0.65;
  }

  @media (max-width: 576px) {
    .fair-assistant-widget {
      right: 16px;
      bottom: 16px;
    }
  }
</style>

<div
  class="fair-assistant-widget"
  data-page="{{ assistant_page|default:'search' }}"
  data-object-id="{{ assistant_object_id|default:'' }}"
  data-endpoint="{% url 'fair_assistant_ask' %}"
>
  <button class="fair-assistant-toggle" type="button" aria-label="Open FAIR Data Assistant" title="FAIR Data Assistant">
    <i data-feather="message-circle"></i>
  </button>

  <div class="fair-assistant-panel" role="dialog" aria-label="FAIR Data Assistant">
    <div class="fair-assistant-header">
      <div class="fair-assistant-title">FAIR Data Assistant</div>
      <button class="fair-assistant-close" type="button" aria-label="Close assistant">
        <i data-feather="x"></i>
      </button>
    </div>

    <div class="fair-assistant-messages">
      <div class="fair-assistant-message assistant">
        Ask about upload rules, search filters, or the current data object.
      </div>
    </div>

    <div class="fair-assistant-suggestions">
      {% if assistant_page == "detail" %}
        <button class="fair-assistant-suggestion" type="button" data-question="Summarize this data">Summarize</button>
        <button class="fair-assistant-suggestion" type="button" data-question="Explain mechanical_BC">mechanical_BC</button>
        <button class="fair-assistant-suggestion" type="button" data-question="What can I plot?">Plot</button>
      {% elif assistant_page == "upload" %}
        <button class="fair-assistant-suggestion" type="button" data-question="How should I write shared_with?">shared_with</button>
        <button class="fair-assistant-suggestion" type="button" data-question="What if identifier already exists?">identifier</button>
        <button class="fair-assistant-suggestion" type="button" data-question="Why did upload reject empty values?">empty values</button>
      {% else %}
        <button class="fair-assistant-suggestion" type="button" data-question="How do I find copper data?">copper data</button>
        <button class="fair-assistant-suggestion" type="button" data-question="How do I search by phase?">phase</button>
        <button class="fair-assistant-suggestion" type="button" data-question="How do I find public data?">public data</button>
      {% endif %}
    </div>

    <form class="fair-assistant-form">
      <textarea class="fair-assistant-input" placeholder="Ask a question"></textarea>
      <div class="fair-assistant-actions">
        <button class="fair-assistant-send" type="submit">Send</button>
      </div>
    </form>
  </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function () {
  function getCookie(name) {
    const cookies = document.cookie ? document.cookie.split(";") : [];

    for (let i = 0; i < cookies.length; i += 1) {
      const cookie = cookies[i].trim();

      if (cookie.substring(0, name.length + 1) === `${name}=`) {
        return decodeURIComponent(cookie.substring(name.length + 1));
      }
    }

    return "";
  }

  function appendAssistantMessage(messages, text, type) {
    const message = document.createElement("div");
    message.className = `fair-assistant-message ${type}`;
    message.textContent = text;
    messages.appendChild(message);
    messages.scrollTop = messages.scrollHeight;
    return message;
  }

  function renderSuggestions(container, suggestions, submitQuestion) {
    if (!Array.isArray(suggestions) || !suggestions.length) {
      return;
    }

    container.replaceChildren();

    suggestions.forEach(function (suggestion) {
      const button = document.createElement("button");
      button.className = "fair-assistant-suggestion";
      button.type = "button";
      button.textContent = suggestion;
      button.addEventListener("click", function () {
        submitQuestion(suggestion);
      });
      container.appendChild(button);
    });
  }

  document.querySelectorAll(".fair-assistant-widget").forEach(function (widget) {
    const toggle = widget.querySelector(".fair-assistant-toggle");
    const close = widget.querySelector(".fair-assistant-close");
    const form = widget.querySelector(".fair-assistant-form");
    const input = widget.querySelector(".fair-assistant-input");
    const send = widget.querySelector(".fair-assistant-send");
    const messages = widget.querySelector(".fair-assistant-messages");
    const suggestions = widget.querySelector(".fair-assistant-suggestions");
    const endpoint = widget.dataset.endpoint;
    const page = widget.dataset.page || "search";
    const objectId = widget.dataset.objectId || "";
    let isLoading = false;

    function submitQuestion(rawQuestion) {
      const question = String(rawQuestion || input.value || "").trim();

      if (!question || isLoading) {
        return;
      }

      isLoading = true;
      send.disabled = true;
      input.value = "";
      appendAssistantMessage(messages, question, "user");
      const loadingMessage = appendAssistantMessage(messages, "Checking context...", "assistant");

      fetch(endpoint, {
        method: "POST",
        credentials: "same-origin",
        headers: {
          "Content-Type": "application/json",
          "X-CSRFToken": getCookie("csrftoken"),
          "X-Requested-With": "XMLHttpRequest",
        },
        body: JSON.stringify({
          question,
          page,
          object_id: objectId,
        }),
      })
        .then(function (response) {
          return response.json().then(function (data) {
            if (!response.ok) {
              throw new Error(data.error || "Assistant request failed");
            }

            return data;
          });
        })
        .then(function (data) {
          loadingMessage.textContent = data.answer || "No answer was generated.";
          renderSuggestions(suggestions, data.suggestions, submitQuestion);
        })
        .catch(function (error) {
          loadingMessage.textContent = error.message || "Assistant request failed.";
        })
        .finally(function () {
          isLoading = false;
          send.disabled = false;
        });
    }

    toggle.addEventListener("click", function () {
      widget.classList.toggle("is-open");

      if (widget.classList.contains("is-open")) {
        input.focus();
      }
    });

    close.addEventListener("click", function () {
      widget.classList.remove("is-open");
    });

    form.addEventListener("submit", function (event) {
      event.preventDefault();
      submitQuestion();
    });

    suggestions.querySelectorAll(".fair-assistant-suggestion").forEach(function (button) {
      button.addEventListener("click", function () {
        submitQuestion(button.dataset.question || button.textContent);
      });
    });
  });

  if (window.feather) {
    feather.replace();
  }
});
</script>
